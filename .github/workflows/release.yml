name: Release

# Runs when a version tag is pushed. Use scripts/release.sh to create one.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Publish release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    env:
      TACK_SIGNING_P12_BASE64: ${{ secrets.TACK_SIGNING_P12_BASE64 }}
      TACK_SIGNING_P12_PASSWORD: ${{ secrets.TACK_SIGNING_P12_PASSWORD }}
      # Installed copies only accept updates signed by this certificate. Changing it
      # breaks automatic updates and makes everyone approve the app again.
      TACK_CERTIFICATE_ROOT: "4BEB38162B0CC3F4659A0BBC18460534AEAFDC5A"

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: bash scripts/test-with-retry.sh

      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Import signing certificate
        run: |
          if [ -z "$TACK_SIGNING_P12_BASE64" ]; then
            echo "::error::The TACK_SIGNING_P12_BASE64 secret is missing"
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$TACK_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$TACK_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -p codesigning "$keychain" | sed -n 's/.*\([0-9A-F]\{40\}\) "Tack Release Signing".*/\1/p' | head -1)"
          echo "TACK_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: bash scripts/build-dmg.sh

      - name: Check the signature
        run: |
          codesign --verify --strict dist/Tack.app
          requirement="$(codesign -dr - dist/Tack.app 2>&1)"
          echo "$requirement"
          if ! echo "$requirement" | grep -qi "certificate root = H\"$TACK_CERTIFICATE_ROOT\""; then
            echo "::error::Tack.app isn't signed with the project's certificate"
            exit 1
          fi

      - name: Add install note
        run: |
          {
            echo
            echo "### Installing"
            echo
            echo "Tack updates itself automatically. For a first install, copy Tack to Applications, then run:"
            echo
            echo '```bash'
            echo 'xattr -d com.apple.quarantine /Applications/Tack.app'
            echo '```'
          } >> release-notes.md

      - name: Create checksum
        run: cd dist && shasum -a 256 Tack.dmg > Tack.dmg.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Tack ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/Tack.dmg
            dist/Tack.dmg.sha256
          fail_on_unmatched_files: true
