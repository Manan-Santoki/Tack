name: Release

# Runs when a version tag is pushed. Use scripts/release.sh to create one.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    name: Publish release
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write

    # All optional. Without them the release is ad-hoc signed.
    env:
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check the tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match VERSION ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test
        run: swift test

      - name: Extract release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Import signing certificate
        if: env.DEVELOPER_ID_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          echo "TACK_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build
        run: bash scripts/build-dmg.sh

      - name: Notarize
        if: env.TACK_SIGN_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool submit dist/Tack.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/Tack.dmg

      - name: Add install note for unsigned builds
        if: env.TACK_SIGN_IDENTITY == ''
        run: |
          {
            echo
            echo "### Installing"
            echo
            echo "This build isn't notarized, so after copying Tack to Applications, run:"
            echo
            echo '```bash'
            echo 'xattr -d com.apple.quarantine /Applications/Tack.app'
            echo '```'
          } >> release-notes.md

      - name: Create checksum
        run: cd dist && shasum -a 256 Tack.dmg > Tack.dmg.sha256

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          name: Tack ${{ env.VERSION }}
          body_path: release-notes.md
          files: |
            dist/Tack.dmg
            dist/Tack.dmg.sha256
          fail_on_unmatched_files: true
