name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Package
        run: bash scripts/build-dmg.sh

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Tack-dmg
          path: dist/Tack.dmg
          retention-days: 7
